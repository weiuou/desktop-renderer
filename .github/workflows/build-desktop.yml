name: Build desktop

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app
        run: npx tauri build --bundles nsis

      - name: Create Windows release packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows-portable/bin | Out-Null
          Copy-Item src-tauri/target/release/tongcraft-bluemap-renderer.exe release/windows-portable/
          Copy-Item bin/BlueMap-cli.jar release/windows-portable/bin/
          Compress-Archive -Path release/windows-portable/* -DestinationPath release/tongcraft-bluemap-renderer-windows-x64-portable.zip -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: tongcraft-bluemap-renderer-windows-x64
          path: |
            release/*.exe
            release/tongcraft-bluemap-renderer-windows-x64-portable.zip
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate macOS icon
        working-directory: src-tauri
        run: |
          mkdir -p icons/icon.iconset
          cp icons/16x16.png icons/icon.iconset/icon_16x16.png
          cp icons/32x32.png icons/icon.iconset/icon_16x16@2x.png
          cp icons/32x32.png icons/icon.iconset/icon_32x32.png
          cp icons/64x64.png icons/icon.iconset/icon_32x32@2x.png
          cp icons/128x128.png icons/icon.iconset/icon_128x128.png
          cp icons/256x256.png icons/icon.iconset/icon_128x128@2x.png
          cp icons/256x256.png icons/icon.iconset/icon_256x256.png
          cp icons/512x512.png icons/icon.iconset/icon_256x256@2x.png
          cp icons/512x512.png icons/icon.iconset/icon_512x512.png
          cp icons/512x512.png icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns icons/icon.iconset -o icons/icon.icns

      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tongcraft-bluemap-renderer-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release assets
        run: |
          mkdir -p release-assets/upload
          find release-assets -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" \) -print -exec cp "{}" release-assets/upload/ \;
          test -n "$(find release-assets/upload -type f -print -quit)"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/upload/*.exe
            release-assets/upload/*.zip
            release-assets/upload/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
