name: Build desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app
        run: npx tauri build --no-bundle

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: tongcraft-bluemap-renderer-windows-x64
          path: src-tauri/target/release/tongcraft-bluemap-renderer.exe
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate macOS icon
        working-directory: src-tauri
        run: |
          mkdir -p icons/icon.iconset
          cp icons/16x16.png icons/icon.iconset/icon_16x16.png
          cp icons/32x32.png icons/icon.iconset/icon_16x16@2x.png
          cp icons/32x32.png icons/icon.iconset/icon_32x32.png
          cp icons/64x64.png icons/icon.iconset/icon_32x32@2x.png
          cp icons/128x128.png icons/icon.iconset/icon_128x128.png
          cp icons/256x256.png icons/icon.iconset/icon_128x128@2x.png
          cp icons/256x256.png icons/icon.iconset/icon_256x256.png
          cp icons/512x512.png icons/icon.iconset/icon_256x256@2x.png
          cp icons/512x512.png icons/icon.iconset/icon_512x512.png
          cp icons/512x512.png icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns icons/icon.iconset -o icons/icon.icns

      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin --no-sign

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tongcraft-bluemap-renderer-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
